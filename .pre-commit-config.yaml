# Exclui arquivos que não devem ser reformatados
exclude: |
  (?x)^(
    \.github/workflows/.*|
    original_documents/.*|
    .*\.csv
  )$

repos:
  # ── Hooks gerais ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.yml$
      - id: end-of-file-fixer
        exclude: \.yml$
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # ── Formatação Python ────────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3
        types: [python]

  # ── Linting Python ───────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88]
        types: [python]

  # ── Ordenação de imports ─────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]
        types: [python]

  # ── Validação da mensagem de commit ─────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: Validate commit message format
        language: python
        entry: python scripts/validate_commit_msg.py
        stages: [commit-msg]
        always_run: true

  # ── Validação do nome da branch ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-branch-name
        name: Validate branch name format
        language: python
        entry: python scripts/validate_branch_name.py
        stages: [pre-commit]
        always_run: true
