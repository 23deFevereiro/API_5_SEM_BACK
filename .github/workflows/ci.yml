name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

env:
  POSTGRES_DB: lunae
  POSTGRES_USER: fev-23
  POSTGRES_PASSWORD: fev-23
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate isort imports
        run: isort --check-only --profile black api scripts

      - name: Validate Black formatting
        run: black --check api scripts

      - name: Run Flake8
        run: flake8 api scripts

      - name: Run pre-commit
        env:
          # Commit-time guards (branch protection / branch-name format) are for
          # local dev, not CI. Branch-name validation for PRs lives in
          # validate-commits.yml. Skipping them here avoids false failures when
          # CI runs on the protected `main` branch (e.g. via pre-release.yml).
          SKIP: no-commit-to-branch,validate-branch-name
        run: pre-commit run --all-files

  general-check:
    runs-on: ubuntu-latest
    name: General checks
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

  populate-db:
    runs-on: ubuntu-latest
    name: Populate DB
    needs: general-check

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lunae
          POSTGRES_USER: fev-23
          POSTGRES_PASSWORD: fev-23
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Validate dev_db command
        run: python manage.py dev_db

  test:
    runs-on: ubuntu-latest
    name: Test
    needs: populate-db

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lunae
          POSTGRES_USER: fev-23
          POSTGRES_PASSWORD: fev-23
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run seed de testes
        run: python manage.py seed_test

      - name: Run tests with coverage
        run: pytest --cov=api --cov-report=xml:coverage.xml --cov-fail-under=80