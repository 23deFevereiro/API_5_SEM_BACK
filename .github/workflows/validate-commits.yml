name: Validate Commit Messages

on:
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-commits:
    name: Check commit message format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: | 
          pip install --only-binary :all: pre-commit==3.7.0

      - name: Validate branch name
        run: python scripts/validate_branch_name.py

      - name: Validate all commit messages in this PR
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # Commit a partir do qual o padrão passou a ser obrigatório
          # (primeiro commit que adicionou o pre-commit no projeto)
          ENFORCEMENT_SHA="dbd1c3e"
 
          echo "Checking commits from $BASE to $HEAD"
          echo "Skipping commits before enforcement: $ENFORCEMENT_SHA"

          git log --format="%H" $BASE..$HEAD | while read sha; do
            # Ignora commits anteriores à adoção do padrão
            if ! git merge-base --is-ancestor $ENFORCEMENT_SHA $sha 2>/dev/null; then
              echo "-- Skipping legacy commit: $sha"
              continue
            fi
 
            subject=$(git log -1 --format="%s" $sha)
            echo ""
            echo "── Commit: $sha"
            echo "   Message: $subject"

            # Escreve a mensagem completa num arquivo temporário e valida
            git log -1 --format="%B" $sha > /tmp/commit_msg.txt
            python scripts/validate_commit_msg.py /tmp/commit_msg.txt || exit 1
          done

          echo ""
          echo "[OK] All commit messages are valid."